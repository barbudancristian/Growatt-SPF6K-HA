# DongleGrowatt - Home Assistant MQTT sensors
#
# 1. Replace growatt_ABC123 below with your dongle's MQTT topic
#    (shown on the dongle's "Dongle settings" page, field "Topic").
# 2. Put this file in <config>/packages/donglegrowatt.yaml and enable packages in configuration.yaml:
#      homeassistant:
#        packages: !include_dir_named packages
# 3. Restart Home Assistant.
#
# For a second dongle, copy the file, change the topic and the unique_id prefix (dg1_ -> dg2_).

mqtt:
  sensor:
    - name: "Growatt Status"
      unique_id: dg1_status
      state_topic: "tele/growatt_ABC123/SENSOR"
      value_template: "{{ value_json.get('Growatt', {}).get('Status') }}"
      availability_mode: all
      availability:
        - topic: "tele/growatt_ABC123/LWT"
          payload_available: "Online"
          payload_not_available: "Offline"
        - topic: "tele/growatt_ABC123/SENSOR"
          value_template: "{{ 'Online' if value_json.get('Growatt', {}).get('Online') else 'Offline' }}"
          payload_available: "Online"
          payload_not_available: "Offline"
      device:
        identifiers: ["donglegrowatt_1"]
        name: "Growatt inverter"
        manufacturer: "Growatt"
        model: "SPF 6000 ES Plus"
    - name: "Growatt Battery SOC"
      unique_id: dg1_battery_soc
