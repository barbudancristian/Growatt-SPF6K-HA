template:
  - sensor:
      - name: "Producție solară totală"
        unique_id: growatt_helper_productie_solara_totala
        default_entity_id: sensor.productie_solara_totala
        state: "{% set l = ['sensor.growatt_1_pv1_power', 'sensor.growatt_1_pv2_power'] | select('has_value') | list %}{{ (l | map('states') | map('float', 0) | sum) | round(0) if l | count > 0 else none }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
      - name: "Consum casă total"
        unique_id: growatt_helper_consum_casa_total
        default_entity_id: sensor.consum_casa_total
        state: "{% set l = ['sensor.growatt_1_output_power'] | select('has_value') | list %}{{ (l | map('states') | map('float', 0) | sum) | round(0) if l | count > 0 else none }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
      - name: "Rețea putere totală"
        unique_id: growatt_helper_retea_putere_totala
        default_entity_id: sensor.retea_putere_totala
        state: "{% set l = ['sensor.growatt_1_grid_power'] | select('has_value') | list %}{{ (l | map('states') | map('float', 0) | sum) | round(0) if l | count > 0 else none }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
      - name: "Baterie putere netă"
        unique_id: growatt_helper_baterie_putere_neta
        default_entity_id: sensor.baterie_putere_neta
        state: "{% set l = ['sensor.growatt_1_battery_power'] | select('has_value') | list %}{{ (l | map('states') | map('float', 0) | sum) | round(0) if l | count > 0 else none }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
      - name: "Baterie SOC mediu"
        unique_id: growatt_helper_baterie_soc_mediu
        default_entity_id: sensor.baterie_soc_mediu
        state: "{% set l = ['sensor.growatt_1_battery_soc'] | select('has_value') | map('states') | map('float') | list %}{{ (l | sum / l | count) | round(0) if l | count > 0 else none }}"
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
      - name: "Baterie timp până la gol"
        unique_id: growatt_helper_baterie_timp_pana_goala
        default_entity_id: sensor.baterie_timp_pana_goala
        state: "{% set p = states('sensor.baterie_putere_neta') | float(0) %}{% set s = states('sensor.baterie_soc_mediu') | float(none) %}{% set cap = states('input_number.growatt_battery_capacity') | float(10) %}{% set mn = states('input_number.growatt_battery_min_soc') | float(15) %}{% if p < -10 and s is number %}{{ ([s - mn, 0] | max / 100 * cap * 1000 / -p) | round(2) }}{% else %}{{ none }}{% endif %}"
        unit_of_measurement: "h"
        device_class: duration
      - name: "Baterie timp până la plin"
        unique_id: growatt_helper_baterie_timp_pana_plina
        default_entity_id: sensor.baterie_timp_pana_plina
        state: "{% set p = states('sensor.baterie_putere_neta') | float(0) %}{% set s = states('sensor.baterie_soc_mediu') | float(none) %}{% set cap = states('input_number.growatt_battery_capacity') | float(10) %}{% if p > 10 and s is number %}{{ ([100 - s, 0] | max / 100 * cap * 1000 / p) | round(2) }}{% else %}{{ none }}{% endif %}"
        unit_of_measurement: "h"
        device_class: duration
      - name: "Baterie ETA gol"
        unique_id: growatt_helper_baterie_eta_goala
        default_entity_id: sensor.baterie_eta_goala
        state: "{% set h = states('sensor.baterie_timp_pana_goala') | float(none) %}{{ (now() + timedelta(hours=h)).isoformat() if h is number else none }}"
        device_class: timestamp
      - name: "Baterie ETA plin"
        unique_id: growatt_helper_baterie_eta_plina
        default_entity_id: sensor.baterie_eta_plina
        state: "{% set h = states('sensor.baterie_timp_pana_plina') | float(none) %}{{ (now() + timedelta(hours=h)).isoformat() if h is number else none }}"
        device_class: timestamp
