        model: "SPF (DongleGrowatt)"
    - name: "Output power"
      unique_id: growatt_1_output_power
      default_entity_id: sensor.growatt_1_output_power
      state_topic: "tele/growatt_INV1/SENSOR"
      value_template: "{% set v = value_json.get('Growatt', {}).get('Output', {}).get('Power') %}{{ (v) | round(0) | int if v is number else none }}"
      availability_mode: all
      availability:
        - topic: "tele/growatt_INV1/LWT"
