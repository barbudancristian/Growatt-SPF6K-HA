; DongleGrowatt build environment (copied next to platformio.ini by the workflow)
; SPDX-License-Identifier: GPL-3.0-or-later
;
; The environment name must start with "tasmota32c3-" for the build scripts.
; custom_files_upload puts the driver scripts into the file system of the factory image.

[env:tasmota32c3-donglegrowatt]
extends                 = env:tasmota32_base
board                   = esp32c3
build_flags             = ${env:tasmota32_base.build_flags}
                          -DFIRMWARE_TASMOTA32
                          -DCODE_IMAGE_STR='"donglegrowatt"'
lib_ignore              = ${env:tasmota32_base.lib_ignore}
                          Micro-RTSP
custom_files_upload     = ${env:tasmota32_base.custom_files_upload}
                          dongle/autoexec.be
                          dongle/growatt.be
